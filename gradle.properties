# ---------------------------------------------------------------------------
# 构建机 / Gradle 配置
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# JDK 21 不在 PATH、也不想让 Gradle 自动下载时，在这里指到你的 JDK（按需打开）
#org.gradle.java.installations.paths=C:\\Program Files\\Zulu\\zulu-21

# ---------------------------------------------------------------------------
# 版本与映射（NeoForge ModDevGradle）
# ---------------------------------------------------------------------------
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.249
loader_version_range=[1,)

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# ---------------------------------------------------------------------------
# 模组标识
# 其余元数据（版本号 / 名称 / 作者 / 描述 / 依赖）都在
# src/main/resources/META-INF/neoforge.mods.toml 里，改那里就行。
# ---------------------------------------------------------------------------
mod_id=createhardener
mod_group_id=dev.createhardener
